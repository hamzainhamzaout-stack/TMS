services:
  postgres:
    container_name: driver_pg
    build:
      dockerfile: Dockerfile.db
      context: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-drivermgmt}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5435:5432"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${POSTGRES_DB:-drivermgmt} -U ${POSTGRES_USER:-user}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=${DM_DB_DSN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network

  driver-mgmt-service:
    build: .
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - shared-network

  swagger-ui:
    image: swaggerapi/swagger-ui
    volumes:
      - ./docs:/usr/share/nginx/html/docs
    environment:
      API_URL: docs/swagger.yaml
    networks:
      - shared-network

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - driver-mgmt-service
      - swagger-ui
    restart: unless-stopped
    networks:
      - shared-network

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres:
  certbot:

networks:
  shared-network:
