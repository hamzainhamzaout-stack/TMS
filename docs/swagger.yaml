  /admin/driver/{id}/picture:
    post:
      tags: ["Admin - Drivers"]
      summary: "Upload driver profile picture"
      description: |
        Uploads an image to Cloudinary (folder `drivers`) and saves its URL as the driver's
        `profile_picture_url`, replacing any previous one. Max request size: 10 MB.
        The driver is checked before the upload, so an unknown id returns 404 without uploading.
      security:
        - CookieAuth: []
      consumes:
        - "multipart/form-data"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - name: "picture"
          in: "formData"
          required: true
          type: "file"
          description: "Image file (max 10 MB)"
      responses:
        "200":
          description: "Profile picture updated"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      id:
                        type: "integer"
                        format: "int32"
                      profile_picture_url:
                        type: "string"
                        example: "https://res.cloudinary.com/<cloud>/image/upload/v1/drivers/abc123.png"
        "400":
          description: "Invalid id, body over 10 MB, not multipart, or `picture` missing"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"

