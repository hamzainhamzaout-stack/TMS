swagger: "2.0"
info:
  title: "Driver Management API"
  description: "API for managing drivers, cars, and trips."
  version: "1.0.0"
host: "localhost:8080"
basePath: "/"
schemes:
  - "http"
paths:
  /health:
    get:
      summary: "Health check"
      responses:
        "200":
          description: "OK"
  /login:
    post:
      summary: "User login"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "User login data"
          required: true
          schema:
            $ref: "#/definitions/UserLogin"
      responses:
        "200":
          description: "Successful login"
  /logout:
    post:
      summary: "User logout"
      responses:
        "200":
          description: "Successful logout"
  /admin/user:
    post:
      summary: "Create a new user"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "User data"
          required: true
          schema:
            $ref: "#/definitions/User"
      responses:
        "201":
          description: "User created"
  /admin/role:
    get:
      summary: "Get all roles"
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of roles"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Role"
    post:
      summary: "Create a new role"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Role data"
          required: true
          schema:
            $ref: "#/definitions/Role"
      responses:
        "201":
          description: "Role created"
  /admin/role/{id}:
    patch:
      summary: "Update a role"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          description: "Role data"
          required: true
          schema:
            $ref: "#/definitions/Role"
      responses:
        "200":
          description: "Role updated"
    delete:
      summary: "Delete a role"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Role deleted"
  /admin/driver:
    get:
      summary: "Get all drivers"
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of drivers"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Driver"
    post:
      summary: "Create a new driver"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Driver data"
          required: true
          schema:
            $ref: "#/definitions/Driver"
      responses:
        "201":
          description: "Driver created"
  /admin/driver/{id}:
    patch:
      summary: "Update a driver"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int64"
        - in: "body"
          name: "body"
          description: "Driver data"
          required: true
          schema:
            $ref: "#/definitions/Driver"
      responses:
        "200":
          description: "Driver updated"
    delete:
      summary: "Delete a driver"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int64"
      responses:
        "200":
          description: "Driver deleted"
  /admin/cars:
    get:
      summary: "Get all cars"
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of cars"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Car"
    post:
      summary: "Create a new car"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Car data"
          required: true
          schema:
            $ref: "#/definitions/Car"
      responses:
        "201":
          description: "Car created"
  /admin/cars/{id}:
    patch:
      summary: "Update a car"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          description: "Car data"
          required: true
          schema:
            $ref: "#/definitions/Car"
      responses:
        "200":
          description: "Car updated"
    delete:
      summary: "Delete a car"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Car deleted"
  /admin/cars/{id}/driver:
    patch:
      summary: "Change a car's driver"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          description: "Driver ID"
          required: true
          schema:
            $ref: "#/definitions/CarDriver"
      responses:
        "200":
          description: "Car's driver updated"
  /admin/trip:
    get:
      summary: "Get all trips"
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of trips"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Trip"
    post:
      summary: "Create a new trip"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Trip data"
          required: true
          schema:
            $ref: "#/definitions/Trip"
      responses:
        "201":
          description: "Trip created"
  /admin/trip/{id}:
    get:
      summary: "Get trip detail"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Trip detail"
          schema:
            $ref: "#/definitions/TripDetail"
    patch:
      summary: "Update a trip"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          description: "Trip data"
          required: true
          schema:
            $ref: "#/definitions/Trip"
      responses:
        "200":
          description: "Trip updated"
    delete:
      summary: "Delete a trip"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Trip deleted"
  /admin/expense:
    get:
      summary: "Get all expense types"
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of expense types"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Expense"
    post:
      summary: "Create a new expense"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Expense data"
          required: true
          schema:
            $ref: "#/definitions/Expense"
      responses:
        "201":
          description: "Expense created"
  /admin/stats:
    get:
      summary: "Get stats"
      produces:
        - "application/json"
      responses:
        "200":
          description: "Stats"
          schema:
            $ref: "#/definitions/Stats"
  /finance/trip:
    get:
      summary: "Get all trips"
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of trips"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Trip"
  /finance/trip/{id}:
    get:
      summary: "Get trip detail"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Trip detail"
          schema:
            $ref: "#/definitions/TripDetail"
  /finance/trip/{id}/upload-receipt:
    post:
      summary: "Upload a receipt for a trip"
      consumes:
        - "multipart/form-data"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - name: "receipt"
          in: "formData"
          description: "Receipt file"
          required: true
          type: "file"
      responses:
        "200":
          description: "Receipt uploaded"
  /user/password:
    post:
      summary: "Reset user password"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Password reset data"
          required: true
          schema:
            type: "object"
            properties:
              password:
                type: "string"
      responses:
        "200":
          description: "Password reset successful"
definitions:
  UserLogin:
    type: "object"
    properties:
      phone_number:
        type: "string"
      password:
        type: "string"
  User:
    type: "object"
    properties:
      first_.name:
        type: "string"
      last_name:
        type: "string"
      phone_number:
        type: "string"
      role_id:
        type: "integer"
        format: "int32"
  Role:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int32"
      name:
        type: "string"
  Driver:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      first_name:
        type: "string"
      last_name:
        type: "string"
      phone_number:
        type: "string"
      licenses:
        type: "string"
      status:
        type: "string"
  Car:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int32"
      make:
        type: "string"
      model:
        type: "string"
      plate_number:
        type: "string"
      status:
        type: "string"
        enum:
          - "available"
          - "in_use"
          - "maintenance"
          - "inactive"
      driver_id:
        type: "integer"
        format: "int64"
  CarDriver:
    type: "object"
    properties:
      current_driver_id:
        type: "integer"
        format: "int64"
  Trip:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int32"
      driver_id:
        type: "integer"
        format: "int64"
      total_cost:
        type: "number"
        format: "double"
      expenses:
        type: "array"
        items:
          type: "integer"
          format: "int32"
  TripDetail:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int32"
      driver_id:
        type: "integer"
        format: "int64"
      total_cost:
        type: "number"
        format: "double"
      expenses:
        type: "array"
        items:
          $ref: "#/definitions/Expense"
      receipt_url:
        type: "string"
  Expense:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int32"
      name:
        type: "string"
  Stats:
    type: "object"
    properties:
      drivers:
        type: "integer"
        format: "int64"
      cars:
        type: "integer"
        format: "int64"
      trips:
        type: "integer"
        format: "int64"
      expenses:
        type: "integer"
        format: "int64"
