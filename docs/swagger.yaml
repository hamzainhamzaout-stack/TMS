      id:
        type: "integer"
        format: "int32"
        readOnly: true
      current_driver_id:
        type: "integer"
        format: "int32"
        x-nullable: true
      license_plate:
        type: "string"
      make:
        type: "string"
      model:
        type: "string"
      year:
        type: "integer"
        format: "int32"
        minimum: 1900
      color:
        type: "string"
      vin:
        type: "string"
      fuel_type:
        type: "string"
        enum: ["petrol", "diesel", "electric", "hybrid"]
      transmission:
        type: "string"
        enum: ["manual", "automatic"]
      mileage:
        type: "string"
        format: "decimal"
        x-nullable: true
        example: "1200.50"
        description: "Returned as a string; requests may send a number or a string"
      status:
        type: "string"
        enum: ["available", "in_use", "maintenance", "inactive"]
      created_at:
        type: "string"
        example: "2026-11-25T10:30:00"
        description: "Timestamp without timezone"
        x-nullable: true
      updated_at:
        type: "string"
        example: "2026-11-25T10:30:00"
        description: "Timestamp without timezone"
        x-nullable: true
