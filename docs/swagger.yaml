          $ref: "#/responses/InternalError"

  /finance/trip/{id}:
    get:
      tags: ["Finance"]
      summary: "Get trip detail"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Trip detail"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/TripDetail"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: ["Finance"]
      summary: "Create a trip expense (with optional receipt upload)"
      security:
        - CookieAuth: []
      consumes:
        - "multipart/form-data"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - name: "expense_id"
          in: "formData"
          required: true
          type: "integer"
          format: "int32"
        - name: "cost"
          in: "formData"
          required: true
          type: "number"
          format: "double"
        - name: "transaction_date"
          in: "formData"
          required: true
          type: "string"
          description: "Format: `2006-01-02T15:04`"
        - name: "remark"
          in: "formData"
          required: false
          type: "string"
        - name: "receipt"
          in: "formData"
          description: "Optional receipt file"
          required: false
          type: "file"
      responses:
        "200":
          description: "Expense added. `data` is the trip id (an integer)."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "integer"
                    format: "int32"
        "409":
          description: "Expense for this trip already exists"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /finance/trip-expense/{id}:
    patch:
      tags: ["Finance"]
      summary: "Update a trip expense (with optional receipt upload)"
      description: "`id` is the **trip id**; the expense row is identified by `trip id + expense_id`. `remark` is required here (unlike create). If no new `receipt` is sent, the stored receipt URL is replaced with an empty value."
      security:
        - CookieAuth: []
      consumes:
        - "multipart/form-data"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - name: "expense_id"
          in: "formData"
          required: true
          type: "integer"
          format: "int32"
        - name: "cost"
          in: "formData"
          required: true
          type: "number"
          format: "double"
        - name: "transaction_date"
          in: "formData"
          required: true
          type: "string"
          description: "Format: `2006-01-02T15:04`"
        - name: "remark"
          in: "formData"
          required: true
          type: "string"
        - name: "receipt"
          in: "formData"
          description: "Optional receipt file"
          required: false
          type: "file"
      responses:
        "201":
          description: "Expense updated (note: status code is 201)"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/TripExpenseRecord"
        "409":
          description: "Expense for this trip already exists"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /finance/driver-pay:
    post:
      tags: ["Finance"]
      summary: "Register driver payment"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/DriverPayment"
      responses:
        "200":
          description: "Driver payment recorded as a ledger entry"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/DriverLedgerRecord"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /finance/trip-overhead:
    post:
      tags: ["Finance"]
      summary: "Register trip overhead"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/TripOverhead"
      responses:
        "200":
          description: "Trip overhead recorded"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/TransactionRecord"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /finance/trip-return:
    post:
      tags: ["Finance"]
      summary: "Register trip return payment"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/ReturnPayment"
      responses:
        "200":
          description: "Return payment recorded. Returns the updated trip."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/TripRecord"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /track:
    get:
      tags: ["Tracking"]
      summary: "Ingest Traccar GPS position (OsmAnd query format)"
      description: "Public endpoint; device token (`id`) is the credential."
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "query"
          required: true
          type: "string"
        - name: "lat"
          in: "query"
          required: true
          type: "number"
          format: "double"
        - name: "lon"
          in: "query"
          required: true
          type: "number"
          format: "double"
        - name: "timestamp"
          in: "query"
          required: false
          type: "string"
      responses:
        "200":
          description: "Location(s) received"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      received:
                        type: "integer"
                        description: "Number of fixes in the request"
                      stored:
                        type: "integer"
                        description: "Number of fixes stored (invalid/old fixes are dropped)"
        "403":
          description: "Unknown or revoked device token"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "400":
          description: "Missing device id or unparsable position"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: ["Tracking"]
      summary: "Ingest Traccar GPS position (JSON or form)"
      description: "Public endpoint; `device_id` (JSON) or `id` (form/query) is the credential."
      consumes:
        - "application/json"
        - "application/x-www-form-urlencoded"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: false
          schema:
            $ref: "#/definitions/TraccarJSONPayload"
      responses:
        "200":
          description: "Location(s) received"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      received:
                        type: "integer"
                        description: "Number of fixes in the request"
                      stored:
                        type: "integer"
                        description: "Number of fixes stored (invalid/old fixes are dropped)"
        "403":
          description: "Unknown or revoked device token"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "400":
          description: "Missing device id or unparsable position"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"

definitions:
  SuccessResponse:
