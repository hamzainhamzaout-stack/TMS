        example: "2026-11-25T10:30:00"
        description: "Timestamp without timezone"
        x-nullable: true
      profile_picture_url:
        type: "string"
        x-nullable: true
        description: "Cloudinary URL of the driver's profile picture; null until one is uploaded"
      license_plate:
        type: "string"
        x-nullable: true
        description: "Plate of the car currently assigned to the driver, if any"
      ledger_entries:
        type: "array"
        description: "Built by Postgres; timestamps have no timezone"
        items:
          $ref: "#/definitions/DriverLedgerRecord"
  DriverLedgerInput:
    type: "object"
    required: ["entry_type", "amount"]
    properties:
      entry_type:
        type: "string"
        description: "Free text (no server-side enum). Conventional values: `SALARY_CREDIT`, `ADVANCE_DEBIT`, `TRIP_ALLOWANCE`; driver payments use `EXPENSE_DRIVER_PAYROLL`."
      amount:
        type: "number"
        format: "double"
      notes:
        type: "string"
  DriverLedgerRecord:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int32"
      driver_id:
        type: "integer"
        format: "int32"
      entry_type:
        type: "string"
        description: "Free text (no server-side enum). Conventional values: `SALARY_CREDIT`, `ADVANCE_DEBIT`, `TRIP_ALLOWANCE`; driver payments use `EXPENSE_DRIVER_PAYROLL`."
      amount:
        type: "number"
        format: "double"
      related_trip_id:
        type: "integer"
        format: "int32"
        x-nullable: true
      notes:
        type: "string"
        x-nullable: true
      created_at:
        type: "string"
        example: "2026-11-25T10:30:00"
        description: "Timestamp without timezone"
        x-nullable: true
  Car:
    type: "object"
