swagger: "2.0"
info:
  title: "Driver Management API"
  description: |
    API for managing users, drivers, cars, trips, finances, and GPS tracking.

    ## Authentication (read first)
    Auth is **cookie-based only**. The server never reads an `Authorization` header.

    - **Web / this page:** call `POST /login`. The browser stores the HttpOnly `accessToken`
      (15 min) and `refreshToken` (3 h) cookies and sends them automatically. Web clients must
      send requests with credentials (`fetch(..., {credentials: "include"})` / axios `withCredentials: true`).
      When the access token expires (401), call `POST /refresh`, then retry.
    - **Mobile / non-browser clients:** call `POST /login` with header `X-Client-Type: mobile`.
      Tokens come back in `data.access_token` / `data.refresh_token`. Send them on later requests
      as a cookie header: `Cookie: accessToken=<access_token>` (and `Cookie: refreshToken=<refresh_token>` for `/refresh` and `/logout`).

    ## Response envelope
    Success: `{"message": string, "status_code": int, "data": any}` (`data` omitted when empty).
    Error: `{"message": string, "status_code": int}`.
    **Empty lists may come back as `null` instead of `[]`** (e.g. `data: null`, `data.drivers: null`). Treat `null` as an empty list.

    ## Data format rules (important for clients)
    - **Money/decimal fields marked `format: decimal` are JSON strings** (e.g. `"1200.5"`), or `null`. Parse them; do not do arithmetic on the raw value.
    - **Timestamps without timezone** look like `2026-11-25T10:30:00` (no `Z`). Fields marked `format: date-time` include a timezone (`2026-11-25T10:30:00Z`).
    - **Request datetimes** (trip times, `settlement_due_date`, `transaction_date`) must be `YYYY-MM-DDTHH:MM` or `YYYY-MM-DDTHH:MM:SS`, **without timezone**. Sending `...Z` or a plain date returns 400.
    - Trip `status` and `payment_status` are returned as objects: `{"trip_status": "CONFIRMED", "valid": true}`.
  version: "1.0.0"
basePath: "/"
securityDefinitions:
  CookieAuth:
    type: "apiKey"
    name: "Cookie"
    in: "header"
    description: |
      Swagger 2.0 cannot model cookie auth directly. In this page, just call `POST /login` first:
      the browser then sends the `accessToken` cookie automatically (the Authorize button is not needed).
      Non-browser clients send the header `Cookie: accessToken=<token>`.
responses:
  Unauthorized:
    description: "Missing, invalid or expired `accessToken` cookie"
    schema:
      $ref: "#/definitions/ErrorResponse"
  Forbidden:
    description: "Authenticated, but the user's role is not allowed (message: `forbidden`)"
    schema:
      $ref: "#/definitions/ErrorResponse"
  BadRequest:
    description: "Invalid path parameter, query parameter or request body"
    schema:
      $ref: "#/definitions/ErrorResponse"
  InternalError:
    description: "Server or database error"
    schema:
      $ref: "#/definitions/ErrorResponse"
  NotFound:
    description: "The requested resource does not exist"
    schema:
      $ref: "#/definitions/ErrorResponse"
tags:
  - name: "Health"
  - name: "Auth"
  - name: "Account"
  - name: "Admin - Users"
  - name: "Admin - Roles"
  - name: "Admin - Drivers"
  - name: "Admin - Cars"
  - name: "Admin - Trips"
  - name: "Admin - Expense Types"
  - name: "Admin - Stats"
  - name: "Admin - Income"
  - name: "Finance"
  - name: "Tracking"

paths:
  /health:
    get:
      tags: ["Health"]
      summary: "Health check"
      produces:
        - "application/json"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/SuccessResponse"

  /login:
    post:
      tags: ["Auth"]
      summary: "User login"
      description: "Authenticates user. Web clients receive HttpOnly cookies; set `X-Client-Type: mobile` to receive tokens in JSON `data`."
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "header"
          name: "X-Client-Type"
          type: "string"
          enum: ["web", "mobile"]
          default: "web"
          required: false
        - in: "body"
          name: "body"
          description: "User login credentials"
          required: true
          schema:
            $ref: "#/definitions/UserLogin"
      responses:
        "200":
          description: |
            Successful login. What `data` contains depends on the client type and the user's state:
            - **web, normal user:** no `data`; `accessToken` + `refreshToken` cookies are set.
            - **web, user must set a password (first login / admin reset):** `data.reset_token`, and a 15-min `passwordResetToken` cookie is set. Next call `POST /user/password`.
            - **mobile, normal user:** `data.access_token` + `data.refresh_token` (no cookies).
            - **mobile, must set a password:** `data.reset_token` only.
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/LoginData"
        "400":
          description: "Invalid JSON, missing fields (`validation error occurred`), or `X-Client-Type` not `web`/`mobile` (`unsupported client type`)"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: "Invalid credentials"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "403":
          description: "User not active"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"

  /refresh:
    post:
      tags: ["Auth"]
      summary: "Refresh access token"
      description: "Reads the `refreshToken` cookie and sets new `accessToken` and `refreshToken` cookies (the refresh token rotates). Mobile clients send `Cookie: refreshToken=<token>`; note the new refresh token is only returned as a cookie (`Set-Cookie`), not in the body."
      produces:
        - "application/json"
      responses:
        "200":
          description: "Token refreshed successfully"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      access_token:
                        type: "string"
        "401":
          description: "Missing, empty, or invalid refresh token (log in again)"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"

  /logout:
    post:
      tags: ["Auth"]
      summary: "User logout"
      description: "Requires both the `accessToken` cookie (auth) and the `refreshToken` cookie (the token to revoke). Clears both cookies."
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      responses:
        "200":
          description: "Successful logout"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      message:
                        type: "string"
        "400":
          description: "Missing or empty refreshToken cookie"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /me:
    get:
      tags: ["Account"]
      summary: "Get current user profile"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      responses:
        "200":
          description: "User profile retrieved"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/UserProfile"
        "401":
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"
    patch:
      tags: ["Account"]
      summary: "Update current user profile"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/UpdateProfileRequest"
      responses:
        "200":
          description: "Profile updated"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      message:
                        type: "string"
                      first_name:
                        type: "string"
                      last_name:
                        type: "string"
                      phone_number:
                        type: "string"
                      status:
                        type: "string"
                        enum: ["uninitialized", "active", "unactive", "deleted"]
        "400":
          description: "Invalid request"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"

  /me/password:
    post:
      tags: ["Account"]
      summary: "Change current user password"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/ChangePasswordRequest"
      responses:
        "200":
          description: "Password changed successfully"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          description: "Invalid input, wrong current password, or password too short"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"

  /account/set_password:
    post:
      tags: ["Account"]
      summary: "Set password using reset cookie (authenticated)"
      description: "Same as `POST /user/password`, but also requires a valid `accessToken` cookie. A user in the first-login / reset flow has no access token yet, so **frontends should use `POST /user/password`** for that flow."
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/PasswordResetBody"
      responses:
        "200":
          description: "Password reset successful"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          description: "Missing reset cookie or invalid body"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /user/password:
    post:
      tags: ["Account"]
      summary: "Set a new password using the reset cookie (first login / after admin reset)"
      description: "Public endpoint. Reads the `passwordResetToken` cookie set by `POST /login` (valid 15 min), sets the new password and clears the cookie. Mobile clients send `Cookie: passwordResetToken=<reset_token>`. After success, log in again with the new password."
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Password reset data"
          required: true
          schema:
            $ref: "#/definitions/PasswordResetBody"
      responses:
        "200":
          description: "Password reset successful"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          description: "Missing reset cookie or invalid body"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "500":
          $ref: "#/responses/InternalError"

  /admin/user:
    post:
      tags: ["Admin - Users"]
      summary: "Create a new user (admin only)"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "User creation payload"
          required: true
          schema:
            $ref: "#/definitions/UserCreate"
      responses:
        "200":
          description: "User created"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/User"
        "400":
          description: "Invalid request"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "409":
          description: "A user with this phone number already exists"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"

  /admin/user/list:
    get:
      tags: ["Admin - Users"]
      summary: "List all users (admin only)"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      responses:
        "200":
          description: "Users retrieved successfully"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/definitions/UserRecord"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"

  /admin/user/{id}:
    patch:
      tags: ["Admin - Users"]
      summary: "Update a user (admin only)"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
          format: "uuid"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/UserUpdateRequest"
      responses:
        "200":
          description: "User updated. Note: `user_name` is returned as an empty string by this endpoint."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/User"
        "400":
          description: "Invalid JSON body"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: ["Admin - Users"]
      summary: "Delete a user (admin only)"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "User deleted"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"

  /admin/user/reset-password:
    post:
      tags: ["Admin - Users"]
      summary: "Admin reset user password (admin only)"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/AdminResetPasswordRequest"
      responses:
        "200":
          description: "User password reset successful"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          description: "Invalid request"
          schema:
            $ref: "#/definitions/ErrorResponse"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"

  /admin/role:
    get:
      tags: ["Admin - Roles"]
      summary: "Get all roles (admin only)"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of roles"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/definitions/Role"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: ["Admin - Roles"]
      summary: "Create a new role (admin only)"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Role data"
          required: true
          schema:
            $ref: "#/definitions/Role"
      responses:
        "201":
          description: "Role created. `data` is the new role's **name** (a string), not a Role object."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "string"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"

  /admin/role/{id}:
    patch:
      tags: ["Admin - Roles"]
      summary: "Update a role (admin only)"
      description: "**The server uses `id` from the JSON body, not from the URL.** Send the same id in both."
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          description: "Role data"
          required: true
          schema:
            $ref: "#/definitions/Role"
      responses:
        "200":
          description: "Role updated. `data` is the role's **name** (a string)."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "string"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: ["Admin - Roles"]
      summary: "Delete a role (admin only)"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Role deleted"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "403":
          $ref: "#/responses/Forbidden"
        "500":
          $ref: "#/responses/InternalError"

  /admin/driver:
    get:
      tags: ["Admin - Drivers"]
      summary: "Get all drivers"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      responses:
        "200":
          description: "A list of drivers wrapped in `data.drivers`"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      drivers:
                        type: "array"
                        items:
                          $ref: "#/definitions/DriverRecord"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: ["Admin - Drivers"]
      summary: "Create a new driver"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - in: "body"
          name: "body"
          description: "Driver data"
          required: true
          schema:
            $ref: "#/definitions/Driver"
      responses:
        "201":
          description: "Driver created. `data.driver` is the driver's first name (the new id is not returned; reload the list)."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      driver:
                        type: "string"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /admin/driver/{id}:
    get:
      tags: ["Admin - Drivers"]
      summary: "Get driver detail"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Driver detail"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    $ref: "#/definitions/DriverDetail"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    patch:
      tags: ["Admin - Drivers"]
      summary: "Update a driver"
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          description: "Driver data"
          required: true
          schema:
            $ref: "#/definitions/Driver"
      responses:
        "200":
          description: "Driver updated. `data.driver` is the driver's first name."
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      driver:
                        type: "string"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: ["Admin - Drivers"]
      summary: "Delete a driver"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Driver deleted"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"

  /admin/driver/{id}/payroll:
    get:
      tags: ["Admin - Drivers"]
      summary: "Get driver ledger"
      security:
        - CookieAuth: []
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "Driver ledger retrieved"
          schema:
            allOf:
              - $ref: "#/definitions/SuccessResponse"
              - type: "object"
                properties:
                  data:
                    type: "object"
                    properties:
                      ledger:
                        type: "array"
                        items:
                          $ref: "#/definitions/DriverLedgerRecord"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: ["Admin - Drivers"]
      summary: "Add payroll entry for driver"
      description: "The driver is taken from the URL; `driver_id` in the body is ignored."
      security:
        - CookieAuth: []
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "id"
          in: "path"
          required: true
          type: "integer"
          format: "int32"
        - in: "body"
          name: "body"
          required: true
          schema:
            $ref: "#/definitions/DriverLedgerInput"
      responses:
        "200":
          description: "Payroll entry added"
          schema:
            $ref: "#/definitions/SuccessResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "401":
          $ref: "#/responses/Unauthorized"
        "500":
