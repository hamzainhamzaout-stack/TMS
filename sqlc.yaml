version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/data/postgres/query.sql"
    schema: "migrations/"
    gen:
      go:
        out: "internal/data/dm_svc_db/"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/greatcloak/decimal"
              type: "NullDecimal"
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
